name: EyesLive Build & Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versão (ex: v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Executável Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de Dependências Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar Executável EyesLive em Modo Release
        run: cargo build --release

      - name: Publicar Executável no GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          name: "EyesLive ${{ github.ref_name || github.event.inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: target/release/eyeslive.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
