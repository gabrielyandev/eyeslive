[package]
name = "eyeslive"
version = "1.0.0"
edition = "2021"
authors = ["Gabriel Yan <yanjob.dev@gmail.com> (@gabrielyandev)"]
repository = "https://github.com/gabrielyandev/eyeslive"
homepage = "https://github.com/gabrielyandev"
description = "EyesLive — High-performance P2P & Relay Remote Desktop without login or session limits, created by Gabriel Yan (@gabrielyandev)"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
screenshots = "0.8"
enigo = "0.2"
arboard = "3.4"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rfd = "0.15"
rand = "0.8"
anyhow = "1.0"
ureq = { version = "2.12", features = ["json"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

[profile.dev.package.image]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
